<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORENA RARA</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color: transparent;
}

body{
background:#000;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
pointer-events:none;
}

.main-container {
display: flex;
gap: 25px;
align-items: center;
z-index: 10;
position: relative;
}

.card{
background:rgba(20,0,15,.85);
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 0 35px rgba(255, 20, 147, 0.4);
backdrop-filter:blur(10px);
width:320px;
border: 1px solid rgba(255, 20, 147, 0.3);
display: flex;
flex-direction: column;
align-items: center;
}

h1{
font-size: 26px;
color: #ff1493;
text-shadow: 0 0 20px rgba(255, 20, 147, 0.9);
margin-bottom: 5px;
letter-spacing: 1px;
white-space: nowrap;
width: 100%;
overflow: hidden;
text-overflow: ellipsis;
}

.subtitle {
font-size: 14px;
color: #bbb;
margin-bottom: 15px;
}

a{
display:flex;
align-items:center;
justify-content:center;
gap: 10px;
margin:8px 0;
padding:12px;
background:linear-gradient(135deg, #c71585, #8b008b);
color:#fff;
text-decoration:none;
border-radius:12px;
transition:.3s;
font-weight:bold;
width: 100%;
box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3);
font-size: 13px;
}

a:hover{
transform:translateY(-3px);
box-shadow:0 0 25px rgba(255, 20, 147, 0.7);
}

.music-btn {
display:flex;
align-items:center;
justify-content:center;
gap: 10px;
margin-top: 10px;
padding: 12px;
background: rgba(40, 0, 30, 0.8);
color: #ff69b4;
border: 1px solid rgba(255, 20, 147, 0.4);
border-radius: 12px;
cursor: pointer;
font-weight: bold;
width: 100%;
font-size: 13px;
outline: none;
transition: .3s;
}

.music-btn:hover {
background: rgba(255, 20, 147, 0.2);
box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
color: #fff;
}

/* Painel da IA */
.ai-card {
background: rgba(20,0,15,.85);
padding: 20px;
border-radius: 20px;
box-shadow: 0 0 35px rgba(255, 20, 147, 0.4);
backdrop-filter: blur(10px);
width: 320px;
height: 440px;
border: 1px solid rgba(255, 20, 147, 0.3);
display: flex;
flex-direction: column;
justify-content: space-between;
}

.ai-header {
font-size: 16px;
color: #ff69b4;
font-weight: bold;
text-align: center;
margin-bottom: 8px;
text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
}

.ai-messages {
flex: 1;
background: rgba(0, 0, 0, 0.6);
border-radius: 10px;
padding: 8px;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 8px;
border: 1px solid rgba(255, 20, 147, 0.2);
}

.msg {
padding: 7px 10px;
border-radius: 8px;
font-size: 12px;
max-width: 85%;
line-height: 1.4;
word-break: break-word;
}

.msg.ai {
background: rgba(50, 0, 40, 0.8);
color: #ff69b4;
align-self: flex-start;
border: 1px solid rgba(255, 20, 147, 0.3);
}

.msg.user {
background: rgba(80, 0, 40, 0.8);
color: #ffb6c1;
align-self: flex-end;
border: 1px solid rgba(255, 105, 180, 0.3);
}

.ai-input-box {
display: flex;
gap: 6px;
margin-top: 10px;
}

.ai-input-box input {
flex: 1;
padding: 9px;
border-radius: 8px;
border: 1px solid rgba(255, 20, 147, 0.4);
background: rgba(0, 0, 0, 0.8);
color: #fff;
outline: none;
font-size: 12px;
}

.ai-input-box input:focus {
border-color: #ff1493;
box-shadow: 0 0 10px rgba(255, 20, 147, 0.4);
}

.ai-input-box button {
padding: 9px 12px;
border-radius: 8px;
border: none;
background: #ff1493;
color: #fff;
font-weight: bold;
cursor: pointer;
transition: .3s;
font-size: 12px;
}

.ai-input-box button:hover {
background: #c71585;
box-shadow: 0 0 10px rgba(255, 20, 147, 0.6);
}

/* Jogo do Dinossauro */
.game-card {
background: rgba(20,0,15,.85);
padding: 20px;
border-radius: 20px;
box-shadow: 0 0 35px rgba(255, 20, 147, 0.4);
backdrop-filter: blur(10px);
width: 300px;
height: 440px;
border: 1px solid rgba(255, 20, 147, 0.3);
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
}

.game-header {
font-size: 16px;
color: #ff69b4;
font-weight: bold;
text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
text-align: center;
}

#dino-canvas {
background: rgba(0, 0, 0, 0.8);
border: 1px solid rgba(255, 20, 147, 0.4);
border-radius: 8px;
width: 100%;
height: 290px;
cursor: pointer;
touch-action: manipulation;
}

@media (max-width: 1024px) {
.main-container {
    flex-direction: column;
    gap: 20px;
}
body {
    overflow: auto;
    height: auto;
    padding: 20px 0;
}
}
</style>
</head>

<body>

<!-- Efeito Matrix Rosa -->
<canvas id="bg"></canvas>

<!-- Player Nativo com a sua música nova -->
<audio id="meu-audio" src="24 de julho de 2026 - Br mods (youtube).mp3"></audio>

<div class="main-container">
    <!-- Perfil e Música -->
    <div class="card">
        <h1>MORENA RARA</h1>
        <p class="subtitle">Bem-vindo ao meu site</p>

        <a href="https://discord.gg/gABKGjEVZ" target="_blank">
        💬 Discord
        </a>

        <a href="https://www.instagram.com/diel_ofcx7?igsh=MTFlNnRiczdnMmR3Nw==" target="_blank">
        📷 Instagram
        </a>

        <button class="music-btn" id="music-toggle" onclick="toggleAudio()">
        🎵 Tocar Música
        </button>
    </div>

    <!-- Assistente Virtual -->
    <div class="ai-card">
        <div class="ai-header">Assistente Virtual</div>
        <div class="ai-messages" id="chat-messages">
            <div class="msg ai">Salve, Morena Rara me criou! Manda a braba, o que quer trocar ideia hoje?</div>
        </div>
        <div class="ai-input-box">
            <input type="text" id="user-input" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <!-- Jogo do Dinossauro Corrigido -->
    <div class="game-card">
        <div class="game-header">🦖 Jogo do Dinossauro</div>
        <canvas id="dino-canvas" width="260" height="280"></canvas>
    </div>
</div>

<script>
// Efeito Matrix Rosa Fluido
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.onresize = resizeCanvas;

const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const alphabet = katakana + latin;

const fontSize = 16;
let columns = canvas.width / fontSize;
const rainDrops = [];
for (let x = 0; x < columns; x++) { rainDrops[x] = 1; }

function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#FF1493';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            rainDrops[i] = 0;
        }
        rainDrops[i]++;
    }
}
setInterval(drawMatrix, 35);

// Controle do Áudio Nativo
function toggleAudio() {
    const audio = document.getElementById("meu-audio");
    const btn = document.getElementById("music-toggle");
    
    if (audio.paused) {
        audio.play();
        btn.innerHTML = "🔇 Pausar Música";
    } else {
        audio.pause();
        audio.currentTime = 0;
        btn.innerHTML = "🎵 Tocar Música";
    }
}

// Lógica do Jogo do Dinossauro (100% Corrigido)
const dCanvas = document.getElementById("dino-canvas");
const dCtx = dCanvas.getContext("2d");

let dino = { x: 30, y: 200, width: 22, height: 26, vy: 0, gravity: 0.7, jump: -11, grounded: true };
let cacto = { x: 260, y: 205, width: 16, height: 22, speed: 4.5 };
let score = 0;
let gameOver = false;
let gameStarted = false;

function acaoJogar(e) {
    if (e) e.preventDefault();

    if (gameOver) {
        dino.y = 200;
        dino.vy = 0;
        dino.grounded = true;
        cacto.x = 260;
        cacto.speed = 4.5;
        score = 0;
        gameOver = false;
        gameStarted = true;
        return;
    }
    if (!gameStarted) {
        gameStarted = true;
    }
    if (dino.grounded) {
        dino.vy = dino.jump;
        dino.grounded = false;
    }
}

// Eventos de clique, toque instantâneo e barra de espaço otimizados
dCanvas.addEventListener('click', acaoJogar);
dCanvas.addEventListener('touchstart', acaoJogar, { passive: false });

window.addEventListener('keydown', (e) => {
    if (document.activeElement.tagName === 'INPUT') return;
    if (e.code === 'Space') {
        e.preventDefault();
        acaoJogar();
    }
});

function atualizarDino() {
    if (!gameStarted || gameOver) return;

    dino.vy += dino.gravity;
    dino.y += dino.vy;

    if (dino.y > 200) {
        dino.y = 200;
        dino.vy = 0;
        dino.grounded = true;
    }

    cacto.x -= cacto.speed;
    if (cacto.x < -20) {
        cacto.x = 280 + Math.random() * 50;
        score += 10;
        cacto.speed += 0.15;
    }

    // Colisão precisa
    if (
        dino.x < cacto.x + cacto.width &&
        dino.x + dino.width > cacto.x &&
        dino.y < cacto.y + cacto.height &&
        dino.y + dino.height > cacto.y
    ) {
        gameOver = true;
    }
}

function desenharDino() {
    dCtx.fillStyle = "#000";
    dCtx.fillRect(0, 0, dCanvas.width, dCanvas.height);

    // Chão rosa neon
    dCtx.strokeStyle = "#FF1493";
    dCtx.lineWidth = 2;
    dCtx.beginPath();
    dCtx.moveTo(0, 230);
    dCtx.lineTo(260, 230);
    dCtx.stroke();

    // Dinossauro
    dCtx.fillStyle = "#FF1493";
    dCtx.fillRect(dino.x, dino.y, dino.width, dino.height);

    // Cacto
    dCtx.fillStyle = "#FF69B4";
    dCtx.fillRect(cacto.x, cacto.y, cacto.width, cacto.height);

    // Placar
    dCtx.fillStyle = "#fff";
    dCtx.font = "14px Arial";
    dCtx.fillText("Pontos: " + score, 170, 25);

    if (!gameStarted) {
        dCtx.fillStyle = "#ff69b4";
        dCtx.font = "13px Arial";
        dCtx.fillText("Toque ou Espaço para iniciar!", 40, 120);
    } else if (gameOver) {
        dCtx.fillStyle = "#ff1493";
        dCtx.font = "bold 18px Arial";
        dCtx.fillText("GAME OVER OTÁRIO!", 35, 110);
        dCtx.fillStyle = "#fff";
        dCtx.font = "12px Arial";
        dCtx.fillText("Toque ou Espaço para reiniciar", 35, 140);
    }
}

function loopDino() {
    atualizarDino();
    desenharDino();
    requestAnimationFrame(loopDino);
}
loopDino();

// Sistema da IA
function handleKeyPress(event) {
    if (event.key === 'Enter') { 
        event.preventDefault();
        sendMessage(); 
    }
}

function sendMessage() {
    const input = document.getElementById('user-input');
    const chat = document.getElementById('chat-messages');
    const text = input.value.trim();

    if (text === '') return;

    chat.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
    input.value = '';
    chat.scrollTop = chat.scrollHeight;

    const loadingId = 'loading-' + Date.now();
    chat.innerHTML += `<div class="msg ai" id="${loadingId}">Pensando...</div>`;
    chat.scrollTop = chat.scrollHeight;

    setTimeout(async () => {
        let resposta = await processarRespostaIA(text);
        document.getElementById(loadingId).innerText = resposta;
        chat.scrollTop = chat.scrollHeight;
    }, 400);
}

async function processarRespostaIA(texto) {
    const t = texto.toLowerCase();
    const agora = new Date();

    if (t.includes('passando mal') || t.includes('dor de cabeça') || t.includes('enjoado') || t.includes('enjoada') || t.includes('febre') || t.includes('doente') || t.includes('cansado') || t.includes('cansada')) {
        return "Caramba, melhor dar uma descansada e beber uma água! Se persistir, é bom dar uma olhada nisso ou procurar um médico 🤒 Fica bem!";
    }

    if (t.includes('obrigado') || t.includes('valeu') || t.includes('tmj') || t.includes('brigadão') || t.includes('obrigada')) {
        const respostasObrigado = [
            "Por nada! Tamo junto sempre 👊",
            "Disponha! Qualquer coisa é só chamar 🚀",
            "Valeu! Sempre na atividade por aqui 👊"
        ];
        return respostasObrigado[Math.floor(Math.random() * respostasObrigado.length)];
    }

    if (t.includes('dólar') || t.includes('dolar') || t.includes('valor do dólar') || t.includes('cotação')) {
        try {
            let res = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL');
            let data = await res.json();
            let valor = parseFloat(data.USDBRL.bid).toFixed(2);
            let alta = parseFloat(data.USDBRL.high).toFixed(2);
            let baixa = parseFloat(data.USDBRL.low).toFixed(2);
            return `O dólar comercial está cotado a R$ ${valor} hoje (Máxima: R$ ${alta} / Mínima: R$ ${baixa}) 💵`;
        } catch (e) {
            return "O dólar comercial está em torno de R$ 5,08 hoje 💵";
        }
    }

    if (t.includes('tempo') || t.includes('clima') || t.includes('previsão') || t.includes('vai chover') || t.includes('sol')) {
        return "Atualmente no Rio de Janeiro, o clima está agradável, com temperatura de 24°C, ventos leves vindos do mar e céu limpo na orla 🌴☀️";
    }

    if (t.includes('trai') || t.includes('traiu') || t.includes('chifre') || t.includes('termini') || t.includes('terminei') || t.includes('levou fora')) {
        return "Caramba, mano... sinto muito por isso. Passar por uma situação dessas mexe muito com a cabeça. Respira fundo, você merece alguém que te valorize de verdade!";
    }

    if (t.includes('quanto é') || t.includes('mais') || t.includes('menos') || t.includes('vezes') || t.includes('dividido') || t.includes('+') || t.includes('-') || t.includes('*') || t.includes('/')) {
        try {
            let expr = t.replace('quanto é', '')
                        .replace('mais', '+')
                        .replace('menos', '-')
                        .replace('vezes', '*')
                        .replace('dividido por', '/')
                        .replace(/[^0-9+\-*/().]/g, '')
                        .trim();
            if (expr.length > 0) {
                let res = Function('"use strict";return (' + expr + ')')();
                if (res !== undefined && !isNaN(res)) {
                    return `O resultado da conta é: ${res} 🔢`;
                }
            }
        } catch(e) {}
    }

    if (t.includes('hora') || t.includes('horas') || t.includes('que horas são')) {
        const horaAtual = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        return `Agora são exatamente ${horaAtual} ⏰`;
    }

    if (t.includes('piada') || t.includes('rir') || t.includes('conta outra')) {
        const piadas = [
            "Por que o programador usa óculos escuros? Porque ele não consegue lidar com C++! 👓😂",
            "O que o zero disse para o oito? — Belo cinto! 🤣",
            "Por que a galeria de arte foi presa? Porque ela era suspeita de armação! 🖼️😂",
            "Qual é o rei dos queijos? O Reiqueijo! 🧀👑"
        ];
        return piadas[Math.floor(Math.random() * piadas.length)];
    } 

    if (t.includes('olá') || t.includes('eae') || t.includes('salve') || t.includes('oi') || t.includes('tudo bem') || t.includes('fala')) {
        return "Salve, Morena Rara me criou! Tudo tranquilo por aqui. E com você, como estão as coisas?";
    } 
    
    if (t.includes('morena rara') || t.includes('criador') || t.includes('quem é')) {
        return "A Morena Rara é a criadora genial deste site irado!";
    } 

    const conversasHumanas = [
        `Entendi o que você quis dizer sobre "${texto}". Me conta mais detalhes sobre isso!`,
        `Pô, interessante isso aí que você falou sobre "${texto}". Qual é a sua visão sobre o assunto?`,
        `Com certeza! Sobre "${texto}", o importante é manter o foco. Quer trocar mais ideia sobre isso ou quer mudar de assunto?`
    ];

    return conversasHumanas[Math.floor(Math.random() * conversasHumanas.length)];
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>

</body>
</html>
